# Replaces buggy "wroket-latency-p99" (redundant AND, no API coverage).
# Update existing policy id 13417397610361527654:
#   gcloud monitoring policies update 13417397610361527654 \
#     --policy-from-file=infra/monitoring/alert-policy-web-latency-p99.yaml \
#     --project=involuted-reach-490718-h4

displayName: "wroket-web-latency-p99"
combiner: OR
enabled: true
conditions:
  - displayName: "wroket-web p99 latency > 3s for 5min"
    conditionThreshold:
      filter: >
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "wroket-web"
        AND metric.type = "run.googleapis.com/request_latencies"
      comparison: COMPARISON_GT
      thresholdValue: 3000
      duration: 300s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_PERCENTILE_99
          crossSeriesReducer: REDUCE_MAX
          groupByFields:
            - resource.label.service_name
      trigger:
        count: 1

notificationChannels:
  - projects/involuted-reach-490718-h4/notificationChannels/12683066122650849013

severity: WARNING

documentation:
  mimeType: text/markdown
  subject: "wroket-web-latency-p99"
  content: |
    ## wroket-web latency p99

    Frontend p99 request latency stayed above **3 s** for **5 minutes**.
    Sustained window reduces cold-start noise (min instances = 0).

alertStrategy:
  autoClose: 1800s
  notificationPrompts:
    - OPENED
