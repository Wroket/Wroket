# Create:
#   gcloud monitoring policies create \
#     --policy-from-file=infra/monitoring/alert-policy-api-latency-p99.yaml \
#     --project=involuted-reach-490718-h4

displayName: "wroket-api-latency-p99"
combiner: OR
enabled: true
conditions:
  - displayName: "wroket-api p99 latency > 3s for 5min"
    conditionThreshold:
      filter: >
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "wroket-api"
        AND metric.type = "run.googleapis.com/request_latencies"
      comparison: COMPARISON_GT
      thresholdValue: 3000
      duration: 300s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_PERCENTILE_99
          crossSeriesReducer: REDUCE_MAX
          groupByFields:
            - resource.label.service_name
      trigger:
        count: 1

notificationChannels:
  - projects/involuted-reach-490718-h4/notificationChannels/12683066122650849013

severity: WARNING

documentation:
  mimeType: text/markdown
  subject: "wroket-api-latency-p99"
  content: |
    ## wroket-api latency p99

    API p99 stayed above **3 s** for **5 minutes** (baseline p99 usually <100 ms).
    Check Firestore latency, cold starts, and slow routes in Logging.

alertStrategy:
  autoClose: 1800s
  notificationPrompts:
    - OPENED
