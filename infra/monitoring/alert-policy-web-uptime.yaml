# Fix: attach notification channel (was missing → silent outages).
# Update:
#   gcloud monitoring policies update 6873619614913231142 \
#     --policy-from-file=infra/monitoring/alert-policy-web-uptime.yaml \
#     --project=involuted-reach-490718-h4

displayName: "wroket.com-uptime uptime failure"
combiner: OR
enabled: true
conditions:
  - displayName: "Failure of uptime check_id wroket-com-uptime-jlydLulMAQk"
    conditionThreshold:
      filter: >
        metric.type="monitoring.googleapis.com/uptime_check/check_passed"
        AND metric.label.check_id="wroket-com-uptime-jlydLulMAQk"
        AND resource.type="uptime_url"
      comparison: COMPARISON_GT
      thresholdValue: 1
      duration: 60s
      aggregations:
        - alignmentPeriod: 1200s
          perSeriesAligner: ALIGN_NEXT_OLDER
          crossSeriesReducer: REDUCE_COUNT_FALSE
          groupByFields:
            - resource.label.*
      trigger:
        count: 1

notificationChannels:
  - projects/involuted-reach-490718-h4/notificationChannels/12683066122650849013

severity: CRITICAL

documentation:
  mimeType: text/markdown
  subject: "wroket.com-uptime"
  content: |
    ## Frontend uptime failure

    Uptime check `wroket.com-uptime` failed (HTTPS GET `/` on wroket.com).

alertStrategy:
  autoClose: 1800s
  notificationPrompts:
    - OPENED
